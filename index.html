<script type="text/babel">
function App() {
  const route = useHashRoute();

  // Determine page and screen label
  let page, label, headerTone = 'dark';
  if (route === '/' || route === '') {
    page = <HomePage/>;
    label = '00 Home';
  } else if (route === '/ecossistema') {
    page = <EcossistemaPage/>;
    label = '01 Ecossistema';
  } else if (route.startsWith('/produto/')) {
    const slug = route.split('/')[2];
    page = <ProdutoPage slug={slug}/>;
    label = '02 Produto · ' + slug;
  } else if (route === '/sbk-ia') {
    page = <SBKIAPage/>;
    label = '03 SBK IA';
  } else if (route === '/sobre') {
    page = <SobrePage/>;
    label = '04 Sobre';
  } else if (route === '/resultados') {
    page = <ResultadosPage/>;
    label = '05 Resultados';
  } else if (route === '/contato') {
    page = <ContatoPage/>;
    label = '06 Contato';
  } else if (route === '/termos') {
    page = <TermosDeUsoPage/>;
    label = '07 Termos de Uso';
  } else if (route === '/privacidade') {
    page = <PrivacidadePage/>;
    label = '08 Privacidade';
  } else if (route === '/cookies') {
    page = <CookiesPage/>;
    label = '09 Política de Cookies';
  } else {
    page = <HomePage/>;
    label = '00 Home';
  }

  React.useEffect(() => {
    document.title = 'SBK · ' + label.replace(/^\d+\s/, '');
    const root = document.querySelector('[data-screen-label]');
    if (root) root.setAttribute('data-screen-label', label);
  }, [label]);

  return (
    <>
      <SBKHeader tone={headerTone}/>
      <main>{page}</main>
      <SBKFooter/>
      <SBKTweaks/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
